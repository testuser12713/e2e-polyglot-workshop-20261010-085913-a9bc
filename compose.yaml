# Start the two data stores the workshop portal needs, for a local clone:
#
#   docker compose up -d
#
# Then start the API with the matching connection variables (see README.md):
#   DATABASE_URL=postgresql://app:app@localhost:5432/app \
#   VALKEY_URL=redis://localhost:6379/0 ... go run ./cmd/api

services:
  db:
    image: docker.io/library/postgres:18.6-trixie
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 5s
      retries: 30

  queue:
    image: docker.io/valkey/valkey:9.1.2-trixie
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
